name: rocm-qualification

on:
  push:
    paths: &hip-inputs
      - .github/workflows/rocm-qualification.yml
      - CMakeLists.txt
      - cmake/**
      - src/gpu/**
      - src/core/*.hpp
      - third_party/**
      - tools/build.ps1
      - tools/compile_hip_object.ps1
      - tools/hip_architecture.ps1
      - tools/rocm_toolchain.ps1
      - tools/rocm-sdk-lock.json
      - tools/process_environment.ps1
      - tools/cmake_toolchain.ps1
      - tools/cmake-toolchain.sha256
      - tools/build_parallelism.ps1
      - tools/local_resources.ps1
      - tools/bootstrap_rocm_sdk.py
      - tools/native_build_provenance.py
      - tools/native_build_receipt.py
  pull_request:
    paths: *hip-inputs
  workflow_dispatch:
    inputs:
      runner:
        description: Fresh Windows image for complete SDK provisioning and HIP compilation
        required: true
        default: windows-2025-vs2026
        type: choice
        options:
          - windows-2025-vs2026
          - windows-2022

permissions:
  contents: read

concurrency:
  group: rocm-qualification-${{ github.ref }}-${{ inputs.runner || 'windows-2025-vs2026' }}
  cancel-in-progress: true

jobs:
  compile-link:
    name: Compile and link the pinned native ROCm toolchain
    runs-on: ${{ inputs.runner || 'windows-2025-vs2026' }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Resource diagnostics and environment regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Free,Used
          Get-CimInstance Win32_OperatingSystem | Select-Object FreePhysicalMemory,TotalVisibleMemorySize
          tools/test_process_environment.ps1
          tools/test_rocm_toolchain.ps1
      - name: Provision complete pinned SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content -LiteralPath tools/rocm-sdk-lock.json -Raw | ConvertFrom-Json
          $sdkParent = Join-Path $env:RUNNER_TOOL_CACHE "superzip-rocm-$($lock.version)-$($lock.sha256.Substring(0, 12))"
          $sdkRoot = python tools/bootstrap_rocm_sdk.py --parent $sdkParent
          if ($LASTEXITCODE -ne 0) { throw 'Complete ROCm SDK provisioning failed.' }
          . ./tools/rocm_toolchain.ps1
          $sdkRoot = Assert-RocmSdkRoot -Root ([string]$sdkRoot)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "HIP_PATH=$sdkRoot"
      - name: Compile and link all release targets
        shell: pwsh
        run: tools/build.ps1 -Configuration Release -HipArch release -HipPath $env:HIP_PATH
      - name: Validate required-HIP build receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = python tools/native_build_receipt.py validate --configuration Release --require-hip
          if ($LASTEXITCODE -ne 0) { throw 'HIP qualification requires a current successful native receipt.' }
          $identity = ($receipt -join [Environment]::NewLine) | ConvertFrom-Json
          Write-Output "HIP receipt SHA-256: $($identity.receipt_sha256); native inputs: $($identity.inputs_sha256)."
      - name: Record compile qualification limits
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify the qualified source.' }
          $lockHash = (Get-FileHash tools/rocm-sdk-lock.json -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Source: $commit; SDK lock SHA-256: $lockHash."
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (
            'Complete pinned SDK provisioning and HIP compilation/linking passed for the release target set. ' +
            'This job does not test GPU execution, install drivers, package or publish a release.'
          )
