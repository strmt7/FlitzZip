name: greenbone-openvas-vulnetix

on:
  push:
    paths: &scanner-inputs
      - .github/workflows/greenbone-openvas-vulnetix.yml
      - .github/workflows/greenbone-openvas-live.yml
      - .github/openvas/**
      - .github/requirements/requirements-gvm-tools-linux.txt
  pull_request:
    paths: *scanner-inputs
  workflow_dispatch:

permissions:
  contents: read # allow checkout and scan artifact collection

concurrency:
  group: greenbone-openvas-vulnetix-${{ github.ref }}
  # This is an offline audit, not the stateful live scanner workflow.
  cancel-in-progress: true

jobs:
  openvas-integration-audit:
    name: Greenbone/OpenVAS integration audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Validate private configuration handling offline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            execFileSync(process.execPath, ['--test', '.github/openvas/resolve_config.test.cjs'], { stdio: 'inherit' });
      - name: Install Greenbone tools
        shell: bash
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/requirements-gvm-tools-linux.txt
      - name: Validate complete report and gate contracts offline
        shell: bash
        run: |
          set -euo pipefail
          python .github/openvas/test_openvas_scan.py
          mkdir -p reports/openvas
          python - <<'PY'
          import importlib.metadata
          import json
          from pathlib import Path

          output_dir = Path("reports/openvas")
          summary = {
              "tool": "Greenbone/OpenVAS integration audit",
              "status": "offline-contracts-passed",
              "python_gvm_version": importlib.metadata.version("python-gvm"),
              "live_scan_status": "requires-authorized-target-and-oidc-broker",
              "configuration_contract": "docs/security-code-scanning.md",
          }
          (output_dir / "openvas-integration-summary.json").write_text(
              json.dumps(summary, indent=2), encoding="utf-8",
          )
          (output_dir / "openvas-integration-summary.md").write_text(
              "# Greenbone/OpenVAS integration audit\n\n"
              "The canonical report, completion, cleanup and vulnerability-gate contracts passed offline. "
              "An authenticated live scan and upload require the documented OIDC broker and authorized target.\n",
              encoding="utf-8",
          )
          PY
      - name: Upload OpenVAS integration artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: greenbone-openvas-integration-audit
          path: reports/openvas
          if-no-files-found: error
