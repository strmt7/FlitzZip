name: scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read # allow repository metadata/content checks by default

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: OSSF Scorecard supply-chain security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Scorecard is a repository-level check. The action rejects non-default
    # branch push refs, so this workflow is intentionally default-branch only.
    # Keep this job limited to action steps; Scorecard verifies that shape before
    # publishing signed results.
    permissions:
      actions: read # allow Scorecard workflow policy checks
      contents: read # allow repository metadata/content checks
      id-token: write # allow Scorecard result signing
      security-events: write # allow Scorecard SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF
        if: always() && hashFiles('scorecard-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
