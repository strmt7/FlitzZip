name: benchmark-graph

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/benchmark-graph.yml
      - README.md
      - docs/benchmarks/data/**
      - docs/comparative-benchmark-methodology.md
      - docs/benchmark-permissions.md
      - docs/benchmark-research.md
      - resources/benchmarks/**
      - tools/run_archive_comparison.py
      - tools/benchmark_comparators.py
      - tools/benchmark_permissions.json
      - tools/test_benchmark_comparators.py
      - tools/benchmark_cache.py
      - tools/test_benchmark_cache.py
      - tools/render_comparison_graph.py
      - tools/render_tradeoff_graph.py
      - tools/render_native_tradeoff_graph.py
      - tools/render_benchmark_graph.py
      - tools/test_archive_comparison.py
      - tools/test_comparison_graph.py
      - tools/test_tradeoff_graph.py
      - tools/test_native_tradeoff_graph.py
      - tools/test_benchmark_graph.py
  pull_request:
    paths:
      - .github/workflows/benchmark-graph.yml
      - README.md
      - docs/benchmarks/data/**
      - docs/comparative-benchmark-methodology.md
      - docs/benchmark-permissions.md
      - docs/benchmark-research.md
      - resources/benchmarks/**
      - tools/run_archive_comparison.py
      - tools/benchmark_comparators.py
      - tools/benchmark_permissions.json
      - tools/test_benchmark_comparators.py
      - tools/benchmark_cache.py
      - tools/test_benchmark_cache.py
      - tools/render_comparison_graph.py
      - tools/render_tradeoff_graph.py
      - tools/render_native_tradeoff_graph.py
      - tools/render_benchmark_graph.py
      - tools/test_archive_comparison.py
      - tools/test_comparison_graph.py
      - tools/test_tradeoff_graph.py
      - tools/test_native_tradeoff_graph.py
      - tools/test_benchmark_graph.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Regenerate reviewed README graph
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Test graph validation
        run: >-
          python -m unittest tools.test_benchmark_graph tools.test_archive_comparison
          tools.test_comparison_graph tools.test_tradeoff_graph tools.test_native_tradeoff_graph
          tools.test_benchmark_comparators tools.test_benchmark_cache
      - name: Generate and verify README graph
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t records < <(find docs/benchmarks/data -maxdepth 1 -type f -name 'native-*.json' -print | LC_ALL=C sort)
          if [[ ${#records[@]} -eq 0 ]]; then
            echo 'No reviewed native benchmark records found.' >&2
            exit 1
          fi
          arguments=()
          for record in "${records[@]}"; do
            arguments+=(--input "$record")
          done
          python tools/render_benchmark_graph.py "${arguments[@]}" --output resources/benchmarks/native-cpu-hip.svg --check
          grep -Fq 'resources/benchmarks/native-cpu-hip.svg' README.md
      - name: Regenerate reviewed application comparison
        shell: bash
        run: |
          set -euo pipefail
          record=docs/benchmarks/data/comparison-silesia-current.json
          if [[ ! -f "$record" ]]; then
            echo 'No reviewed application comparison record yet; renderer unit tests passed.'
            exit 0
          fi
          python -m tools.render_comparison_graph --input "$record" --output "$RUNNER_TEMP/comparison.svg"
          cmp "$RUNNER_TEMP/comparison.svg" resources/benchmarks/application-comparison.svg
          grep -Fq 'resources/benchmarks/application-comparison.svg' README.md
          grep -Fq 'docs/comparative-benchmark-methodology.md' README.md
      - name: Regenerate reviewed effort tradeoff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t records < <(find docs/benchmarks/data -maxdepth 1 -type f \
            -name 'comparison-silesia-effort-L*.json' -print | LC_ALL=C sort)
          if [[ ${#records[@]} -eq 0 ]]; then
            echo 'No reviewed effort sweep yet; renderer unit tests passed.'
            exit 0
          fi
          if [[ ${#records[@]} -ne 5 ]]; then
            echo 'Incomplete reviewed effort sweep.' >&2
            exit 1
          fi
          arguments=()
          for record in "${records[@]}"; do
            arguments+=(--input "$record")
          done
          python -m tools.render_tradeoff_graph "${arguments[@]}" --output "$RUNNER_TEMP/tradeoff.svg"
          cmp "$RUNNER_TEMP/tradeoff.svg" resources/benchmarks/effort-tradeoff.svg
          grep -Fq 'resources/benchmarks/effort-tradeoff.svg' README.md
      - name: Regenerate reviewed native effort tradeoff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t records < <(find docs/benchmarks/data -maxdepth 1 -type f \
            -name 'effort-native-L*.json' -print | LC_ALL=C sort)
          if [[ ${#records[@]} -eq 0 ]]; then
            echo 'No reviewed native effort sweep yet; renderer unit tests passed.'
            exit 0
          fi
          if [[ ${#records[@]} -ne 5 ]]; then
            echo 'Incomplete reviewed native effort sweep.' >&2
            exit 1
          fi
          arguments=()
          for record in "${records[@]}"; do
            arguments+=(--input "$record")
          done
          python -m tools.render_native_tradeoff_graph "${arguments[@]}" --output "$RUNNER_TEMP/native-effort.svg"
          cmp "$RUNNER_TEMP/native-effort.svg" resources/benchmarks/native-effort-tradeoff.svg
          grep -Fq 'resources/benchmarks/native-effort-tradeoff.svg' README.md
