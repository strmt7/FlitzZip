name: benchmark-graph

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/benchmark-graph.yml
      - docs/benchmarks/README.md
      - docs/neutron-public-corpus-benchmark.md
      - tools/neutron_corpus_benchmark.py
      - tools/neutron_corpus_ipc.py
      - tools/test_neutron_corpus_benchmark.py
      - README.md
      - docs/benchmarks/data/**
      - docs/comparative-benchmark-methodology.md
      - docs/benchmark-permissions.md
      - docs/benchmark-research.md
      - resources/benchmarks/**
      - tools/run_archive_comparison.py
      - tools/benchmark_comparators.py
      - tools/benchmark_permissions.json
      - tools/test_benchmark_comparators.py
      - tools/benchmark_cache.py
      - tools/test_benchmark_cache.py
      - tools/render_comparison_graph.py
      - tools/render_tradeoff_graph.py
      - tools/render_native_tradeoff_graph.py
      - tools/render_benchmark_graph.py
      - tools/render_svg_graph.py
      - tools/test_svg_graph.py
      - tools/native_build_provenance.py
      - tools/native_build_receipt.py
      - tools/test_native_build_provenance.py
      - tools/test_native_build_receipt.py
      - tools/test_archive_comparison.py
      - tools/test_comparison_graph.py
      - tools/test_tradeoff_graph.py
      - tools/test_native_tradeoff_graph.py
      - tools/test_benchmark_graph.py
  pull_request:
    paths:
      - .github/workflows/benchmark-graph.yml
      - docs/benchmarks/README.md
      - docs/neutron-public-corpus-benchmark.md
      - tools/neutron_corpus_benchmark.py
      - tools/neutron_corpus_ipc.py
      - tools/test_neutron_corpus_benchmark.py
      - README.md
      - docs/benchmarks/data/**
      - docs/comparative-benchmark-methodology.md
      - docs/benchmark-permissions.md
      - docs/benchmark-research.md
      - resources/benchmarks/**
      - tools/run_archive_comparison.py
      - tools/benchmark_comparators.py
      - tools/benchmark_permissions.json
      - tools/test_benchmark_comparators.py
      - tools/benchmark_cache.py
      - tools/test_benchmark_cache.py
      - tools/render_comparison_graph.py
      - tools/render_tradeoff_graph.py
      - tools/render_native_tradeoff_graph.py
      - tools/render_benchmark_graph.py
      - tools/render_svg_graph.py
      - tools/test_svg_graph.py
      - tools/native_build_provenance.py
      - tools/native_build_receipt.py
      - tools/test_native_build_provenance.py
      - tools/test_native_build_receipt.py
      - tools/test_archive_comparison.py
      - tools/test_comparison_graph.py
      - tools/test_tradeoff_graph.py
      - tools/test_native_tradeoff_graph.py
      - tools/test_benchmark_graph.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate benchmark evidence and graph contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Test graph validation
        run: >-
          python -m unittest tools.test_benchmark_graph tools.test_archive_comparison
          tools.test_svg_graph
          tools.test_comparison_graph tools.test_tradeoff_graph tools.test_native_tradeoff_graph
          tools.test_benchmark_comparators tools.test_benchmark_cache
          tools.test_native_build_provenance tools.test_native_build_receipt
          tools.test_neutron_corpus_benchmark.CorpusContracts.test_published_corpus_studies
