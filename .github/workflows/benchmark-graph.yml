name: benchmark-graph

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/benchmark-graph.yml
      - README.md
      - docs/benchmarks/data/**
      - resources/benchmarks/**
      - tools/render_benchmark_graph.py
      - tools/test_benchmark_graph.py
  pull_request:
    paths:
      - .github/workflows/benchmark-graph.yml
      - README.md
      - docs/benchmarks/data/**
      - resources/benchmarks/**
      - tools/render_benchmark_graph.py
      - tools/test_benchmark_graph.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Regenerate reviewed README graph
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Test graph validation
        run: python -m unittest tools.test_benchmark_graph
      - name: Generate and verify README graph
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t records < <(find docs/benchmarks/data -maxdepth 1 -type f -name 'native-*.json' -print | LC_ALL=C sort)
          if [[ ${#records[@]} -eq 0 ]]; then
            echo 'No reviewed native benchmark records found.' >&2
            exit 1
          fi
          arguments=()
          for record in "${records[@]}"; do
            arguments+=(--input "$record")
          done
          python tools/render_benchmark_graph.py "${arguments[@]}" --output resources/benchmarks/native-cpu-hip.svg --check
          grep -Fq 'resources/benchmarks/native-cpu-hip.svg' README.md
