name: component-contracts

on:
  push:
    paths: &contract-inputs
      - tools/**
      - cmake/**
      - CMakeLists.txt
      - tests/zstd/**
      - tests/cmake/precompiled_headers/**
      - tests/cpp/**
      - tests/cmake/test_zstd*.cmake
      - mcp/**
      - .agents/skills/**
      - .clusterfuzzlite/**
      - .semgrepignore
      - AGENTS.md
      - docs/benchmarks/**
      - docs/benchmark-permissions.md
      - docs/benchmark-research.md
      - docs/comparative-benchmark-methodology.md
      - resources/benchmarks/**
      - src/cli/**
      - .github/workflows/component-contracts.yml
      - .github/workflows/zstd-sanitizers.yml
      - .github/workflows/windows-ci.yml
      - .github/workflows/rocm-qualification.yml
      - .github/workflows/release.yml
      - .github/workflows/security-code-scanning.yml
      - .github/requirements/**
      - .github/scanner-metadata-reviews.csv
      - .github/scanner-secret-reviews.json
      - .github/scanner-secret-reviews-crawl4ai.json
      - .github/scanner-secret-reviews-crawl4ai-tests.json
      - third_party/upstream/nltk/**
      - third_party/upstream/crawl4ai/**
      - .github/scanner-source-reviews.csv
      - .github/scanner-hosted-reviews.csv
      - .github/scanner-hosted-approval.csv
      - .github/scanner-false-positive-reviews.csv
      - .github/codeql/**
      - .github/openvas/**
      - .github/workflows/greenbone-openvas-vulnetix.yml
      - .github/workflows/greenbone-openvas-live.yml
      - .github/workflows/fuzzing.yml
  pull_request:
    paths: *contract-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: component-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tool-contracts:
    name: Test changed development mechanisms
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select contract-test Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install declared contract-test dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/requirements-contracts.txt
          if ($LASTEXITCODE -ne 0) { throw 'Contract-test dependency installation failed.' }
      - name: Test changed tool contracts
        id: contracts
        shell: pwsh
        env:
          PY_PYTHON3: '3.13'
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSH_REF: ${{ github.ref }}
        run: |
          $base = if ($env:EVENT_NAME -eq 'pull_request') { $env:PR_BASE } else { $env:PUSH_BASE }
          if ($base -and $base -notmatch '^0{40}$') {
            if ($base -notmatch '^[0-9a-f]{40}$') { throw 'Invalid comparison commit.' }
            tools/ci_tool_contracts.ps1 -BaseRef $base -HeadRef HEAD -GitHubOutput $env:GITHUB_OUTPUT
          } elseif ($env:EVENT_NAME -eq 'push') {
            if ($env:PUSH_REF -eq "refs/heads/$($env:DEFAULT_BRANCH)") {
              $paths = @(git ls-files)
              if ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate initial default-branch inputs.' }
              tools/ci_tool_contracts.ps1 -ChangedPath $paths -GitHubOutput $env:GITHUB_OUTPUT
            } else {
              tools/ci_tool_contracts.ps1 -InitialPush -DefaultBranch $env:DEFAULT_BRANCH -HeadRef HEAD -GitHubOutput $env:GITHUB_OUTPUT
            }
          } else {
            tools/ci_tool_contracts.ps1 -BaseRef HEAD~1 -HeadRef HEAD -GitHubOutput $env:GITHUB_OUTPUT
          }
      - name: Resolve changed research dependency lock
        if: steps.contracts.outputs.research_lock_changed == 'true'
        shell: pwsh
        run: |
          python -B tools/crawl4ai_tool.py check-lock
          if ($LASTEXITCODE -ne 0) { throw 'The research dependency lock cannot be resolved.' }
