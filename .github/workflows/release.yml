name: release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: SemVer product version without v prefix; leave empty to use CMake project version
        required: false
        default: ""
        type: string
      replace_existing:
        description: Exceptional replacement only; MSI replacements get a fresh ProductCode from the release run identity
        required: false
        default: false
        type: boolean
      replacement_acknowledgement:
        description: Required only when replace_existing=true; enter replace <version>
        required: false
        default: ""
        type: string
      release_track:
        description: Release track; beta publishes a GitHub prerelease, stable publishes a normal release
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
      create_msi:
        description: Build and install-test the MSI in addition to the portable ZIP
        required: false
        default: true
        type: boolean
      publish_release:
        description: Publish only after maintainer approval; false builds and validates candidate artifacts without a tag or release
        required: false
        default: false
        type: boolean

# Top-level read access is enough for workflow dispatch metadata and checkout defaults.
permissions:
  contents: read # allow workflow dispatch metadata and checkout defaults

concurrency:
  group: release-${{ inputs.release_version || github.run_id }}
  cancel-in-progress: false

jobs:
  hosted-windows:
    name: Hosted Windows release validation
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read # validation cannot create tags or releases
    outputs:
      release_version: ${{ steps.meta.outputs.release_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      package_base: ${{ steps.meta.outputs.package_base }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Export release inputs
        shell: pwsh
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
          REPLACEMENT_ACKNOWLEDGEMENT: ${{ inputs.replacement_acknowledgement }}
          RELEASE_TRACK: ${{ inputs.release_track }}
          CREATE_MSI: ${{ inputs.create_msi }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          ENABLE_HIP: "true"
          HIP_ARCH: release
          ALLOW_HIP: "true"
        run: |
          $ErrorActionPreference = "Stop"
          $values = [ordered]@{
              RELEASE_VERSION_INPUT = [string]$env:RELEASE_VERSION_INPUT
              REPLACE_EXISTING = [string]$env:REPLACE_EXISTING
              REPLACEMENT_ACKNOWLEDGEMENT = [string]$env:REPLACEMENT_ACKNOWLEDGEMENT
              RELEASE_TRACK = [string]$env:RELEASE_TRACK
              CREATE_MSI = [string]$env:CREATE_MSI
              PUBLISH_RELEASE = [string]$env:PUBLISH_RELEASE
              ENABLE_HIP = [string]$env:ENABLE_HIP
              HIP_ARCH = [string]$env:HIP_ARCH
              ALLOW_HIP = [string]$env:ALLOW_HIP
          }
          foreach ($entry in $values.GetEnumerator()) {
              if ($entry.Value -match "[`r`n]") {
                  throw "$($entry.Key) must be a single-line value."
              }
              Add-Content -LiteralPath $env:GITHUB_ENV -Value "$($entry.Key)=$($entry.Value)"
          }

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"

      - name: Resolve release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $existingTagsPath = "out\existing-release-tags.txt"
          $existingTags = @(
              gh api --paginate "repos/$env:GITHUB_REPOSITORY/tags" --jq ".[].name"
          )
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to query existing release tags."
          }
          $existingTags |
              Where-Object { $_ } |
              Sort-Object -Unique |
              Set-Content -LiteralPath $existingTagsPath
          if (-not (Test-Path -LiteralPath $existingTagsPath)) {
              Set-Content -LiteralPath $existingTagsPath -Value ""
          }

          $requestedVersion = [string]$env:RELEASE_VERSION_INPUT
          $replaceExisting = $env:REPLACE_EXISTING -eq "true"
          if ($env:PUBLISH_RELEASE -notin @("true", "false")) {
              throw "publish_release must be true or false."
          }
          if ($replaceExisting -and $env:PUBLISH_RELEASE -ne "true") {
              throw "Validation-only runs cannot replace an existing release."
          }
          if ($env:REPLACE_EXISTING -notin @("true", "false")) {
              throw "replace_existing must be true or false."
          }
          if ($replaceExisting -and -not $requestedVersion.Trim()) {
              throw "replace_existing requires an explicit release_version."
          }
          $replacementAcknowledgement = [string]$env:REPLACEMENT_ACKNOWLEDGEMENT
          if (-not $replaceExisting -and $replacementAcknowledgement.Trim()) {
              throw "replacement_acknowledgement is only valid when replace_existing=true."
          }
          if ($replaceExisting) {
              $expectedAcknowledgement = "replace $($requestedVersion.Trim())"
              if ($replacementAcknowledgement -ne $expectedAcknowledgement) {
                  throw (
                      "replace_existing=true requires replacement_acknowledgement exactly " +
                      "'$expectedAcknowledgement'. Replacement is exceptional and must be " +
                      "explicitly requested by a maintainer/user.")
              }
          }
          if ($env:RELEASE_TRACK -notin @("beta", "stable")) {
              throw "release_track must be beta or stable."
          }
          if ($env:CREATE_MSI -notin @("true", "false")) {
              throw "create_msi must be true or false."
          }
          if ($env:ENABLE_HIP -notin @("true", "false")) {
              throw "enable_hip must be true or false."
          }
          if ($env:ALLOW_HIP -notin @("true", "false")) {
              throw "allow_hip must be true or false."
          }
          . (Join-Path $PWD "tools/hip_architecture.ps1")
          $null = Resolve-HipArchitecture -Architecture ([string]$env:HIP_ARCH)
          if ($env:ENABLE_HIP -eq "true" -and $env:ALLOW_HIP -ne "true") {
              throw "enable_hip=true requires allow_hip=true for this runner profile."
          }
          if ($env:RELEASE_TRACK -eq "stable" -and $requestedVersion -match "-") {
              throw "stable releases must not use a prerelease SemVer suffix."
          }

          $metadataArgs = @(
              "tools/release_metadata.py",
              "--requested-version", $requestedVersion,
              "--existing-tags-file", $existingTagsPath,
              "--repo-root", "$PWD",
              "--json-output", "out/release-metadata.json"
          )
          if ($replaceExisting) {
              $metadataArgs += "--allow-existing"
          }
          python @metadataArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata validation failed.' }
          $metadata = Get-Content -LiteralPath out\release-metadata.json -Raw | ConvertFrom-Json
          if ($env:CREATE_MSI -eq 'true') {
              . ./tools/version.ps1
              $null = Assert-FlitzZipMsiPackageVersion -PackageVersion ([string]$metadata.package_version)
          }
          $releaseTag = [string]$metadata.release_tag

          $existingRelease = $false
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -eq 0) {
              $existingRelease = $true
          }
          $existingTag = $false
          $tagQuery = git ls-remote --tags origin "refs/tags/$releaseTag"
          if ($tagQuery) {
              $existingTag = $true
          }
          if (($existingRelease -or $existingTag) -and -not $replaceExisting) {
              throw "Release or tag $releaseTag already exists. Re-run with replace_existing=true to replace it."
          }
          if ($replaceExisting) {
              "REPLACE_RELEASE_TAG=$releaseTag" | Add-Content -LiteralPath $env:GITHUB_ENV
          }

      - name: Provision complete ROCm Core SDK
        if: env.ENABLE_HIP == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lock = Get-Content -LiteralPath tools/rocm-sdk-lock.json -Raw | ConvertFrom-Json
          $sdkParent = Join-Path $env:RUNNER_TOOL_CACHE "flitzzip-rocm-$($lock.version)-$($lock.sha256.Substring(0, 12))"
          $sdkRoot = python tools/bootstrap_rocm_sdk.py --parent $sdkParent
          if ($LASTEXITCODE -ne 0) { throw "Complete ROCm SDK provisioning failed." }
          . ./tools/rocm_toolchain.ps1
          $sdkRoot = Assert-RocmSdkRoot -Root ([string]$sdkRoot)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "HIP_PATH=$sdkRoot"
          # Compiler-only environment is scoped by compile_hip_object.ps1.
          # Product execution continues to use the trusted driver runtime.

      - name: Toolchain diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          Get-Command cmake | Select-Object Source,Version
          Get-ComputerInfo | Select-Object CsSystemType,OSName,OSDisplayVersion
          if ($env:ENABLE_HIP -eq "true") {
              if (-not $env:HIP_PATH) {
                  throw "HIP_PATH must be set before HIP release validation can run."
              }
              $hipcc = Join-Path $env:HIP_PATH "bin/hipcc.exe"
              & $hipcc --version
              if ($LASTEXITCODE -ne 0) { throw "Selected ROCm compiler diagnostics failed." }
          }

      - name: Setup .NET for WiX
        if: env.CREATE_MSI == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # WiX 7.0.0 ships a net8.0 tool; use its supported runtime explicitly.
          dotnet-version: "8.0.426"

      - name: Install WiX
        env:
          WIX_OSMF_EULA_ID: ${{ vars.WIX_OSMF_EULA_ID }}
        if: env.CREATE_MSI == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:WIX_OSMF_EULA_ID -ne "wix7") {
              throw "Set repository variable WIX_OSMF_EULA_ID to wix7 after accepting the WiX v7 OSMF EULA."
          }
          $toolPath = Join-Path $env:RUNNER_TEMP "wix"
          dotnet tool install --tool-path $toolPath wix --version 7.0.0
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $toolPath
          & (Join-Path $toolPath "wix.exe") eula accept $env:WIX_OSMF_EULA_ID
          & (Join-Path $toolPath "wix.exe") --version
          & (Join-Path $toolPath "wix.exe") extension add --global WixToolset.UI.wixext/7.0.0

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildArgs = @{
              Configuration = "Release"
              PackageVersion = $env:PACKAGE_VERSION
              MsiInstallScope = "perMachine"
              MsiProductIdentity = "github-run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_SHA"
          }
          if ($env:ENABLE_HIP -eq "true") {
              $buildArgs.EnableHip = $true
            $buildArgs.HipArch = $env:HIP_ARCH
            $buildArgs.HipPath = $env:HIP_PATH
          } else {
              $buildArgs.CpuOnlyValidation = $true
          }
          & tools/build.ps1 @buildArgs

      - name: Test
        shell: pwsh
        run: tools/test.ps1 -Configuration Release

      - name: Repository security scan
        shell: pwsh
        run: tools/security_scan.ps1

      - name: Package
        env:
          WIX_OSMF_EULA_ID: ${{ vars.WIX_OSMF_EULA_ID }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageArgs = @{
              Configuration = "Release"
              PackageVersion = $env:PACKAGE_VERSION
          }
          if ($env:ENABLE_HIP -ne "true") {
              $packageArgs.AllowCpuValidationPackage = $true
          }
          if ($env:CREATE_MSI -eq "true") {
              if ($env:WIX_OSMF_EULA_ID -ne "wix7") {
                  throw "Set repository variable WIX_OSMF_EULA_ID to wix7 after accepting the WiX v7 OSMF EULA."
              }
              $env:FLITZZIP_ACCEPT_WIX_OSMF_EULA = $env:WIX_OSMF_EULA_ID
              $packageArgs.CreateMsi = $true
          }
          & tools/package.ps1 @packageArgs

      - name: Portable install smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $packageRoot = Join-Path $PWD 'out/install-Release'
          $cli = Join-Path $packageRoot 'bin/flitzzip_cli.exe'
          . ./tools/package_runtime.ps1
          Assert-FlitzZipPackagedRuntime -PackageRoot $packageRoot -HipEnabled $true
          $dependency = & $cli dependency-check
          $dependencyExit = $LASTEXITCODE
          $dependency | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'portable-dependency-check.txt')
          Assert-FlitzZipHipDependencyState -Output $dependency -ExitCode $dependencyExit
          $global:LASTEXITCODE = 0
          & tools/format_matrix_smoke.ps1 -Configuration Release -WorkRoot $env:RUNNER_TEMP -CliPath $cli

          # Exercise packaged native SHA-256 separately from the shared CPU compatibility matrix.
          $root = Join-Path $env:RUNNER_TEMP 'flitzzip-portable-native-smoke'
          $input = Join-Path $root 'input'
          New-Item -ItemType Directory -Force -Path $input | Out-Null
          $source = Join-Path $input 'alpha.txt'
          Set-Content -LiteralPath $source -Value "FlitzZip release smoke $env:RELEASE_TAG"
          $archive = Join-Path $root 'archive.flzip'
          $mode = if ($dependencyExit -eq 0) { '--require-gpu' } else { '--force-cpu' }
          & $cli compress --format flzip $mode --sha256 --output $archive $input
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native compression failed.' }
          & $cli verify --sha256 $archive
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native verification failed.' }
          $extracted = Join-Path $root 'extracted'
          & $cli extract $mode --output $extracted $archive
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native extraction failed.' }
          $restored = Join-Path $extracted 'input/alpha.txt'
          if ((Get-FileHash -LiteralPath $source).Hash -ne (Get-FileHash -LiteralPath $restored).Hash) {
              throw 'Packaged native readback differs from the complete source.'
          }

      - name: MSI install smoke
        if: env.CREATE_MSI == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Get-Variable PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
              $PSNativeCommandUseErrorActionPreference = $false
          }

          Import-Module ./tools/msi_process.psm1 -Force

          $msi = Join-Path $PWD "out\$env:PACKAGE_BASE.msi"
          $installLog = Join-Path $env:RUNNER_TEMP "flitzzip-msi-install.log"
          $repairLog = Join-Path $env:RUNNER_TEMP "flitzzip-msi-repair.log"
          $uninstallLog = Join-Path $env:RUNNER_TEMP "flitzzip-msi-uninstall.log"
          $expectedCli = Join-Path $env:ProgramFiles "FlitzZip\bin\flitzzip_cli.exe"
          $installed = $false
          try {
              Invoke-CheckedMsiExec `
                -Phase "MSI install" `
                -Arguments @("/i", $msi, "/qn", "/norestart", "/L*v", $installLog) `
                -LogPath $installLog `
                -TimeoutSeconds 300
              $installed = $true
              if (-not (Test-Path -LiteralPath $expectedCli)) {
                  throw "Installed CLI was not found at the release MSI Program Files path: $expectedCli"
              }
              $dependency = & $expectedCli dependency-check
              $dependencyExit = $LASTEXITCODE
              $dependency | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "flitzzip-msi-dependency-check.txt")
              if ($env:ENABLE_HIP -eq "true") {
                  . ./tools/package_runtime.ps1
                  Assert-FlitzZipPackagedRuntime -PackageRoot (Split-Path -Parent (Split-Path -Parent $expectedCli)) -HipEnabled $true
                  Assert-FlitzZipHipDependencyState -Output $dependency -ExitCode $dependencyExit
              } elseif ($dependencyExit -ne 0) {
                  throw "Installed dependency check failed with exit code $dependencyExit."
              }
              $stagedCli = Join-Path $PWD 'out/install-Release/bin/flitzzip_cli.exe'
              $expectedCliHash = (Get-FileHash -LiteralPath $stagedCli -Algorithm SHA256).Hash
              if ((Get-FileHash -LiteralPath $expectedCli -Algorithm SHA256).Hash -ne $expectedCliHash) {
                  throw 'Installed CLI differs from the staged release binary.'
              }
              # This freshly installed package owns the exact leaf; repair must restore its original bytes.
              Remove-Item -LiteralPath $expectedCli -Force
              Invoke-CheckedMsiExec `
                -Phase "MSI repair" `
                -Arguments @("/fa", $msi, "/qn", "/norestart", "/L*v", $repairLog) `
                -LogPath $repairLog `
                -TimeoutSeconds 300
              if (-not (Test-Path -LiteralPath $expectedCli)) {
                  throw "Installed CLI was not found after MSI repair at the release MSI Program Files path: $expectedCli"
              }
              if ((Get-FileHash -LiteralPath $expectedCli -Algorithm SHA256).Hash -ne $expectedCliHash) {
                  throw 'MSI repair did not restore the exact staged CLI bytes.'
              }
              $repairDependency = & $expectedCli dependency-check
              $repairDependencyExit = $LASTEXITCODE
              $repairDependency | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "flitzzip-msi-repair-dependency-check.txt")
              if ($env:ENABLE_HIP -eq "true") {
                  Assert-FlitzZipPackagedRuntime -PackageRoot (Split-Path -Parent (Split-Path -Parent $expectedCli)) -HipEnabled $true
                  Assert-FlitzZipHipDependencyState -Output $repairDependency -ExitCode $repairDependencyExit
              } elseif ($repairDependencyExit -ne 0) {
                  throw "Repaired dependency check failed with exit code $repairDependencyExit."
              }
              $global:LASTEXITCODE = 0
          } finally {
              if ($installed) {
                  Invoke-CheckedMsiExec `
                    -Phase "MSI uninstall" `
                    -Arguments @("/x", $msi, "/qn", "/norestart", "/L*v", $uninstallLog) `
                    -LogPath $uninstallLog `
                    -TimeoutSeconds 300
                  if (Test-Path -LiteralPath $expectedCli) {
                      throw "Installed CLI remained after MSI uninstall at $expectedCli."
                  }
                  $global:LASTEXITCODE = 0
              }
          }

      - name: Transactional installer upgrade matrix
        if: env.CREATE_MSI == 'true'
        shell: pwsh
        run: tools/test_installer_lifecycle.ps1 -Full -DisposableMachine

      - name: Retain installer qualification evidence
        if: always() && env.CREATE_MSI == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-qualification-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            out/installer-lifecycle-*/**/*.log
            out/installer-lifecycle-*/result.json
            ${{ runner.temp }}/flitzzip-msi-*.log

      - name: Package corresponding source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tools/release_workflow_policy.ps1
          $source = Join-Path $PWD "out/$env:PACKAGE_BASE-source.zip"
          & git archive --format=zip --prefix=FlitzZip-source/ --output=$source $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Exact-commit source archive creation failed.' }
          Assert-ReleaseCorrespondingSource -ArchivePath $source -RepoRoot $PWD
          $digest = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $(Split-Path -Leaf $source)" | Set-Content -LiteralPath "$source.sha256" -Encoding ascii

      - name: Generate release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $notes = Join-Path $PWD "out\release-notes.md"
          $curatedPath = Join-Path $PWD "docs\releases\$env:RELEASE_VERSION.md"
          if (-not (Test-Path -LiteralPath $curatedPath -PathType Leaf)) {
              throw "Curated release notes are required: $curatedPath"
          }
          $firstLine = Get-Content -LiteralPath $curatedPath -TotalCount 1
          if ($firstLine -ne "# FlitzZip $env:RELEASE_VERSION") {
              throw "Release notes heading must match FlitzZip $env:RELEASE_VERSION."
          }
          $curatedNotes = (Get-Content -LiteralPath $curatedPath -Raw).Trim()
          $hipLine = if ($env:ENABLE_HIP -eq "true") {
              "- AMD HIP enabled: yes, architecture $env:HIP_ARCH. The HIP runtime is supplied by the installed AMD GPU driver."
          } else {
              "- AMD HIP enabled: no. This track is for internal validation only and must not be published as a product release."
          }
          $msiLine = if ($env:CREATE_MSI -eq "true") {
              "- MSI built for per-machine installation and passed silent install, repair, and uninstall smoke tests."
          } else {
              "- MSI was not built in this run."
          }
          @"
          $curatedNotes

          ## Build And Verification

          - 64-bit Windows package only.
          - Release track: $env:RELEASE_TRACK.
          $hipLine
          - Portable ZIP and compatibility-format smoke tests completed after staging install.
          $msiLine
          - Repository security scan completed before publishing.
          - Complete corresponding source and SHA-256 checksum files are attached beside the binary packages.
          "@ | Set-Content -LiteralPath $notes

      - name: Retain validated candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            out/${{ env.PACKAGE_BASE }}-portable.zip
            out/${{ env.PACKAGE_BASE }}-portable.zip.sha256
            out/${{ env.PACKAGE_BASE }}-source.zip
            out/${{ env.PACKAGE_BASE }}-source.zip.sha256
            out/${{ env.PACKAGE_BASE }}.msi
            out/${{ env.PACKAGE_BASE }}.msi.sha256
            out/release-notes.md
            out/release-metadata.json

  publish:
    name: Publish validated release
    if: inputs.publish_release
    needs: hosted-windows
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write # only the explicitly selected publication job can create a release
    env:
      RELEASE_VERSION: ${{ needs.hosted-windows.outputs.release_version }}
      RELEASE_TAG: ${{ needs.hosted-windows.outputs.release_tag }}
      REPLACE_RELEASE_TAG: ${{ needs.hosted-windows.outputs.release_tag }}
      PACKAGE_BASE: ${{ needs.hosted-windows.outputs.package_base }}
      REPLACE_EXISTING: ${{ inputs.replace_existing }}
      RELEASE_TRACK: ${{ inputs.release_track }}
      CREATE_MSI: ${{ inputs.create_msi }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Retrieve validated candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ github.sha }}
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assets = @(
              "out\$env:PACKAGE_BASE-portable.zip",
              "out\$env:PACKAGE_BASE-portable.zip.sha256",
              "out\$env:PACKAGE_BASE-source.zip",
              "out\$env:PACKAGE_BASE-source.zip.sha256"
          )
          if ($env:CREATE_MSI -eq "true") {
              $assets += @(
                  "out\$env:PACKAGE_BASE.msi",
                  "out\$env:PACKAGE_BASE.msi.sha256"
              )
          }
          foreach ($asset in $assets | Where-Object { $_ -notlike "*.sha256" }) {
              $expected = (Get-Content -LiteralPath "$asset.sha256" -Raw).Trim().Split()[0]
              $actual = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($expected -notmatch '^[0-9a-f]{64}$' -or $actual -ne $expected) {
                  throw "Validated candidate checksum mismatch: $asset"
              }
          }
          if ($env:REPLACE_EXISTING -eq "true") {
              if ($env:REPLACE_RELEASE_TAG -ne $env:RELEASE_TAG) {
                  throw "Replacement tag tracking mismatch."
              }
              gh release view $env:RELEASE_TAG *> $null
              if ($LASTEXITCODE -eq 0) {
                  gh release delete $env:RELEASE_TAG --yes --cleanup-tag
              } else {
                  $global:LASTEXITCODE = 0
                  $tagQuery = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
                  if ($tagQuery) {
                      gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$env:RELEASE_TAG"
                  }
              }
          }
          $createArgs = @(
              "release", "create", $env:RELEASE_TAG
          ) + $assets + @(
              "--target", $env:GITHUB_SHA,
              "--title", "FlitzZip $env:RELEASE_TAG",
              "--notes-file", "out\release-notes.md",
              "--draft"
          )
          if ($env:RELEASE_TRACK -eq "beta") {
              $createArgs += "--prerelease"
          }
          gh @createArgs
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed." }
          gh release view $env:RELEASE_TAG --json tagName,isDraft,isPrerelease,assets
          $editArgs = @("release", "edit", $env:RELEASE_TAG, "--draft=false")
          if ($env:RELEASE_TRACK -eq "beta") {
              $editArgs += "--prerelease"
          }
          gh @editArgs
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }
          gh release view $env:RELEASE_TAG --json tagName,isDraft,isPrerelease,assets
