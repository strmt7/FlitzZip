name: security

on:
  push:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read # allow workflow jobs to check out and scan repository contents

concurrency:
  group: security-code-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql-cpp:
    name: CodeQL C++
    runs-on: windows-2022
    # Keep C++ analysis whole-repository. Do not split SuperZip into
    # subdirectory CodeQL databases because archive/parser data flow crosses
    # folders and partial databases can miss cross-component vulnerabilities.
    # CodeQL C++ must trace a real Windows build. Build-free C/C++ analysis
    # under-models SuperZip's Win32, GDI+, HIP-boundary, and vendored C sources
    # and produces parser-artifact alerts that are not acceptable security
    # signals for this repository.
    # CodeQL needs action metadata for analysis, repository contents to build,
    # and security-events write permission to upload SARIF.
    permissions:
      actions: read # allow CodeQL to read workflow/action metadata
      contents: read # allow checkout and C++ database construction
      security-events: write # allow CodeQL SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: c-cpp
          build-mode: manual
          dependency-caching: false
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended,security-and-quality
      - name: Build C++ database input
        shell: pwsh
        run: tools/build.ps1 -Configuration Release -CpuOnlyValidation
      - name: Analyze C++
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:c-cpp

  codeql-actions:
    name: CodeQL GitHub Actions
    runs-on: ubuntu-latest
    # CodeQL needs action metadata for analysis, repository contents to scan,
    # and security-events write permission to upload SARIF.
    permissions:
      actions: read # allow CodeQL to read workflow/action metadata
      contents: read # allow checkout and Actions workflow analysis
      security-events: write # allow CodeQL SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: actions
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended,security-and-quality
      - name: Analyze GitHub Actions
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:actions

  workflow-security:
    name: Workflow lint and injection scan
    runs-on: ubuntu-latest
    # zizmor uses action metadata and uploads workflow-audit SARIF.
    permissions:
      actions: read # allow actionlint/zizmor to inspect action metadata
      contents: read # allow checkout and workflow file analysis
      security-events: write # allow zizmor SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Audit scan scope
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Workflow security scan scope"
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) | sort
          echo "::endgroup::"
      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$HOME/go/bin/actionlint" -color
      - name: Run zizmor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/requirements-zizmor-linux.txt
          zizmor --format sarif --persona auditor .github/workflows > zizmor-results.sarif
      - name: Upload zizmor SARIF
        if: always() && hashFiles('zizmor-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor

  trivy-filesystem:
    name: Trivy filesystem security scan
    runs-on: ubuntu-latest
    # Trivy reads repository contents and uploads filesystem-scan SARIF.
    permissions:
      actions: read # allow scanner action metadata access
      contents: read # allow checkout and filesystem analysis
      security-events: write # allow Trivy SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit scan scope
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Trivy scan scope"
          find . -maxdepth 6 \
            \( -name 'CMakeLists.txt' \
            -o -name '*.cmake' \
            -o -name '*.json' \
            -o -name '*.yml' \
            -o -name '*.yaml' \
            -o -name '*.ps1' \
            -o -name '*.cpp' \
            -o -name '*.hpp' \
            -o -name '*.c' \
            -o -name '*.h' \) | sort
          echo "::endgroup::"
      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          scanners: vuln,misconfig,secret,license
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          exit-code: "1"
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    # Semgrep reads repository contents and uploads SAST SARIF.
    permissions:
      actions: read # allow scanner action metadata access
      contents: read # allow checkout and SAST analysis
      security-events: write # allow Semgrep SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Audit scan scope
        run: |
          echo "::group::Semgrep scan scope"
          find . -type f \
            \( -name '*.cpp' \
            -o -name '*.hpp' \
            -o -name '*.c' \
            -o -name '*.h' \
            -o -name '*.ps1' \
            -o -name '*.py' \
            -o -name '*.yml' \
            -o -name '*.yaml' \
            -o -name '*.md' \
            -o -name 'CMakeLists.txt' \) | sort
          echo "::endgroup::"
      - name: Run Semgrep
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/requirements-semgrep-linux.txt
          semgrep scan \
            --error \
            --sarif \
            --metrics=off \
            --no-git-ignore \
            --max-target-bytes 100000000 \
            --config p/default \
            --config p/github-actions \
            . > semgrep-results.sarif
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  devskim:
    name: DevSkim security lint
    runs-on: ubuntu-latest
    # DevSkim reads repository contents and uploads security-lint SARIF.
    permissions:
      actions: read # allow scanner action metadata access
      contents: read # allow checkout and security lint analysis
      security-events: write # allow DevSkim SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit scan scope
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::DevSkim scan scope"
          find . -type f \
            \( -name '*.cpp' \
            -o -name '*.hpp' \
            -o -name '*.c' \
            -o -name '*.h' \
            -o -name '*.ps1' \
            -o -name '*.py' \
            -o -name '*.yml' \
            -o -name '*.yaml' \
            -o -name '*.md' \
            -o -name 'CMakeLists.txt' \) | sort
          echo "::endgroup::"
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Install DevSkim CLI
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --tool-path "$RUNNER_TEMP/devskim" Microsoft.CST.DevSkim.CLI --version 1.0.90
      - name: Run DevSkim
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devskim/devskim" analyze -I . -O devskim-results.sarif -f sarif -g "**/.git/**"
      - name: Upload DevSkim SARIF
        if: always() && hashFiles('devskim-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: devskim-results.sarif
          category: devskim

  osv-scanner:
    name: OSV dependency vulnerability scan
    # OSV scans dependency manifests and writes dependency SARIF.
    permissions:
      actions: read # allow reusable scanner workflow metadata access
      contents: read # allow dependency manifest discovery
      security-events: write # allow OSV SARIF upload to code scanning
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --recursive
        ./

  grype-filesystem:
    name: Grype filesystem vulnerability scan
    runs-on: ubuntu-latest
    # Grype reads the repository filesystem and uploads vulnerability SARIF.
    permissions:
      contents: read # allow checkout and filesystem dependency analysis
      security-events: write # allow Grype SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: .
          fail-build: true
          severity-cutoff: low
          output-format: sarif
          output-file: grype-results.sarif
      - name: Upload Grype SARIF
        if: always() && hashFiles('grype-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: grype-results.sarif
          category: grype-fs

  secret-history:
    name: Secret history scan
    runs-on: ubuntu-latest
    # Secret scanners need full git history and repository contents.
    permissions:
      contents: read # allow full-history checkout and secret scanning
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare secret scan reports
        shell: bash
        run: mkdir -p reports/secrets
      - name: Run Gitleaks against git history
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git . --redact --verbose --exit-code 1 --report-format json --report-path reports/secrets/gitleaks-git.json
      - name: Run Gitleaks against working tree
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            dir . --redact --verbose --exit-code 1 --report-format json --report-path reports/secrets/gitleaks-dir.json
      - name: Run TruffleHog against git history
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo:ro" \
            trufflesecurity/trufflehog:3.97.4@sha256:562bc231afa9de3d04de44cfe624252b08207de1fc3cebc5e7ed92bed7f279e4 \
            git file:///repo --results=verified,unknown --fail --json > reports/secrets/trufflehog-git.jsonl
      - name: Upload secret scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-history-reports
          path: reports/secrets
          if-no-files-found: error

  sbom:
    name: SBOM generation
    runs-on: ubuntu-latest
    # SBOM generation only needs repository read access.
    permissions:
      contents: read # allow checkout and SBOM source discovery
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: superzip-sbom.spdx.json
          upload-artifact: true
