name: security

on:
  push:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read # allow workflow jobs to check out and scan repository contents

concurrency:
  group: security-code-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-security-plan:
    name: Select whole-database C++ analysis
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      codeql_cpp: ${{ steps.cpp_plan.outputs.codeql_cpp }}
      codeql_hip_host: ${{ steps.cpp_plan.outputs.codeql_hip_host }}
    steps:
      - name: Checkout complete change range
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Select from native and query inputs
        id: cpp_plan
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
        run: >-
          python -B -m tools.cpp_security_plan --event $env:EVENT_NAME
          --push-base "$env:PUSH_BASE" --github-output $env:GITHUB_OUTPUT

  codeql-cpp:
    name: CodeQL C++
    needs: cpp-security-plan
    if: >-
      ${{ !cancelled() && (needs.cpp-security-plan.result != 'success' ||
          needs.cpp-security-plan.outputs.codeql_cpp != 'false') }}
    runs-on: windows-2022
    timeout-minutes: 90
    # The build script derives compiler admission from RAM and logical CPUs,
    # and applies one shared CMake/MSBuild job budget without a fixed CPU cap.
    # Keep C++ analysis whole-repository. Do not split SuperZip into
    # subdirectory CodeQL databases because archive/parser data flow crosses
    # folders and partial databases can miss cross-component vulnerabilities.
    # CodeQL C++ must trace a real Windows build. Build-free C/C++ analysis
    # under-models SuperZip's Win32, GDI+, host GPU-boundary, and vendored C sources
    # and produces parser-artifact alerts that are not acceptable security
    # signals for this repository.
    # Retain CPU configuration branches, adding the HIP configuration to the
    # same database when GPU/shared inputs change. Device-kernel extraction is
    # not claimed; device compilation/review and execution remain separate gates.
    # CodeQL needs action metadata for analysis, repository contents to build,
    # and security-events write permission to upload SARIF.
    permissions:
      actions: read # allow CodeQL to read workflow/action metadata
      contents: read # allow checkout and C++ database construction
      security-events: write # allow CodeQL SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Provision pinned HIP headers and compiler
        if: needs.cpp-security-plan.result != 'success' || needs.cpp-security-plan.outputs.codeql_hip_host != 'false'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = python tools/bootstrap_rocm_sdk.py
          if ($LASTEXITCODE -ne 0) { throw 'CodeQL HIP host SDK provisioning failed.' }
          . ./tools/rocm_toolchain.ps1
          $sdkRoot = Assert-RocmSdkRoot -Root ([string]$sdkRoot)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "HIP_PATH=$sdkRoot"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: c-cpp
          build-mode: manual
          dependency-caching: false
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended,security-and-quality
      - name: Build C++ database input
        shell: pwsh
        run: tools/build.ps1 -Configuration Release -CpuOnlyValidation
      - name: Build HIP host database input
        if: needs.cpp-security-plan.result != 'success' || needs.cpp-security-plan.outputs.codeql_hip_host != 'false'
        shell: pwsh
        run: tools/build.ps1 -Configuration Release -HipArch gfx1201
      - name: Analyze C++
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:c-cpp

  codeql-actions:
    name: CodeQL GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CodeQL needs action metadata for analysis, repository contents to scan,
    # and security-events write permission to upload SARIF.
    permissions:
      actions: read # allow CodeQL to read workflow/action metadata
      contents: read # allow checkout and Actions workflow analysis
      security-events: write # allow CodeQL SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended,security-and-quality
      - name: Analyze GitHub Actions
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:actions

  workflow-security:
    name: Workflow lint and injection scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # zizmor uses action metadata and uploads workflow-audit SARIF.
    permissions:
      actions: read # allow actionlint/zizmor to inspect action metadata
      contents: read # allow checkout and workflow file analysis
      security-events: write # allow zizmor SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Audit scan scope
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Workflow security scan scope"
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) | sort
          echo "::endgroup::"
      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$HOME/go/bin/actionlint" -color
      - name: Run zizmor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/requirements-zizmor-linux.txt
          zizmor --format sarif --persona auditor .github/workflows > zizmor-results.sarif
      - name: Upload zizmor SARIF
        if: always() && hashFiles('zizmor-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor

  trivy-filesystem:
    name: Trivy filesystem security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Trivy reads repository contents and uploads filesystem-scan SARIF.
    permissions:
      actions: read # allow scanner action metadata access
      contents: read # allow checkout and filesystem analysis
      security-events: write # allow Trivy SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit scan scope
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Trivy scan scope"
          find . -maxdepth 6 \
            \( -name 'CMakeLists.txt' \
            -o -name '*.cmake' \
            -o -name '*.json' \
            -o -name '*.yml' \
            -o -name '*.yaml' \
            -o -name '*.ps1' \
            -o -name '*.cpp' \
            -o -name '*.hpp' \
            -o -name '*.c' \
            -o -name '*.h' \) | sort
          echo "::endgroup::"
      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          scanners: vuln,misconfig,secret,license
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          exit-code: "1"
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Semgrep reads repository contents and uploads SAST SARIF.
    permissions:
      actions: read # allow scanner action metadata access
      contents: read # allow checkout and SAST analysis
      security-events: write # allow Semgrep SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Audit scan scope
        run: |
          echo "::group::Semgrep scan scope"
          find . -type f \
            \( -name '*.cpp' \
            -o -name '*.hpp' \
            -o -name '*.c' \
            -o -name '*.h' \
            -o -name '*.ps1' \
            -o -name '*.py' \
            -o -name '*.yml' \
            -o -name '*.yaml' \
            -o -name '*.md' \
            -o -name 'CMakeLists.txt' \) | sort
          echo "::endgroup::"
      - name: Run Semgrep
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tools.test_semgrep_installation
          python -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r .github/requirements/requirements-semgrep-linux.txt
          "$RUNNER_TEMP/semgrep/bin/python" -m pip check
          "$RUNNER_TEMP/semgrep/bin/python" -m unittest tools.test_semgrep_runtime
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan \
            --error \
            --sarif \
            --json-output "$RUNNER_TEMP/semgrep-results.json" \
            --metrics=off \
            --no-git-ignore \
            --disable-nosem \
            --max-target-bytes 100000000 \
            --config p/default \
            --config p/github-actions \
            . > semgrep-results.sarif
      - name: Audit actual Semgrep coverage
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tools.test_semgrep_coverage
          python -m tools.semgrep_coverage \
            --report "$RUNNER_TEMP/semgrep-results.json" > "$RUNNER_TEMP/semgrep-coverage.json"
      - name: Preserve Semgrep coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-coverage
          path: ${{ runner.temp }}/semgrep-coverage.json
          if-no-files-found: error
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  devskim:
    name: DevSkim security lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # DevSkim reads repository contents and uploads security-lint SARIF.
    permissions:
      actions: read # allow scanner action metadata access
      contents: read # allow checkout and security lint analysis
      security-events: write # allow DevSkim SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit scan scope
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::DevSkim scan scope"
          find . -type f \
            \( -name '*.cpp' \
            -o -name '*.hpp' \
            -o -name '*.c' \
            -o -name '*.h' \
            -o -name '*.ps1' \
            -o -name '*.py' \
            -o -name '*.yml' \
            -o -name '*.yaml' \
            -o -name '*.md' \
            -o -name 'CMakeLists.txt' \) | sort
          echo "::endgroup::"
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Validate DevSkim provenance
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tools.test_devskim_provenance
          python -m tools.devskim_provenance --emit-env >> "$GITHUB_ENV"
      - name: Download and install verified DevSkim package
        shell: bash
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/devskim-feed"
          mkdir "$feed"
          package="$feed/microsoft.cst.devskim.cli.$DEVSKIM_VERSION.nupkg"
          base="https://api.nuget.org/v3-flatcontainer/microsoft.cst.devskim.cli"
          curl --fail --silent --show-error --proto '=https' \
            --max-time 60 --max-filesize "$DEVSKIM_NUPKG_BYTES" \
            "$base/$DEVSKIM_VERSION/microsoft.cst.devskim.cli.$DEVSKIM_VERSION.nupkg" \
            --output "$package"
          python -m tools.devskim_provenance --package "$package"
          # NuGet must consume only the verified package, not a second network copy.
          python - "$feed" <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          feed = pathlib.Path(sys.argv[1])
          config = ET.Element("configuration")
          sources = ET.SubElement(config, "packageSources")
          ET.SubElement(sources, "clear")
          ET.SubElement(sources, "add", key="verified", value=str(feed))
          ET.SubElement(ET.SubElement(config, "fallbackPackageFolders"), "clear")
          ET.ElementTree(config).write(feed / "NuGet.Config", encoding="utf-8", xml_declaration=True)
          PY
          # Do not reuse a same-version package from the runner's global cache.
          cache="$RUNNER_TEMP/devskim-packages"
          mkdir "$cache"
          NUGET_PACKAGES="$cache" dotnet tool install --tool-path "$RUNNER_TEMP/devskim" \
            --configfile "$feed/NuGet.Config" \
            Microsoft.CST.DevSkim.CLI --version "$DEVSKIM_VERSION"
      - name: Run DevSkim
        shell: bash
        run: |
          set -euo pipefail
          SUPERZIP_DEVSKIM="$RUNNER_TEMP/devskim/devskim" python -m unittest tools.test_devskim_report tools.test_devskim_scope
          python -m tools.devskim_scope --root . --output "$RUNNER_TEMP/devskim-options.json"
          "$RUNNER_TEMP/devskim/devskim" analyze -I . -O "$RUNNER_TEMP/devskim-raw.sarif" \
            -f sarif --options-json "$RUNNER_TEMP/devskim-options.json" --disable-supression --skip-excerpts
          python -m tools.devskim_report "$RUNNER_TEMP/devskim-raw.sarif" devskim-results.sarif
      - name: Upload DevSkim SARIF
        if: always() && hashFiles('devskim-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: devskim-results.sarif
          category: devskim

  osv-scanner:
    name: OSV dependency vulnerability scan
    # OSV scans dependency manifests and writes dependency SARIF.
    permissions:
      actions: read # allow reusable scanner workflow metadata access
      contents: read # allow dependency manifest discovery
      security-events: write # allow OSV SARIF upload to code scanning
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --recursive
        --lockfile=requirements.txt:tools/requirements/crawl4ai.txt
        --lockfile=requirements.txt:tools/requirements/nltk-build.txt
        ./

  grype-filesystem:
    name: Grype filesystem vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Grype reads the repository filesystem and uploads vulnerability SARIF.
    permissions:
      contents: read # allow checkout and filesystem dependency analysis
      security-events: write # allow Grype SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: .
          fail-build: true
          severity-cutoff: low
          output-format: sarif
          output-file: grype-results.sarif
      - name: Upload Grype SARIF
        if: always() && hashFiles('grype-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: grype-results.sarif
          category: grype-fs

  secret-history:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secret scanners need full git history and repository contents.
    permissions:
      contents: read # allow full-history checkout and secret scanning
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare secret scan reports
        shell: bash
        run: mkdir -p reports/secrets
      - name: Verify secret policies and report redaction
        id: report-safety
        shell: bash
        run: python -m unittest tools.test_redact_trufflehog tools.test_gitleaks_policy
      - name: Run Gitleaks against git history
        if: ${{ !cancelled() && steps.report-safety.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git . --config .github/gitleaks.toml --redact --verbose --exit-code 1 --report-format json --report-path reports/secrets/gitleaks-git.json
      - name: Run Gitleaks against working tree
        if: ${{ !cancelled() && steps.report-safety.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            dir . --config .github/gitleaks.toml --redact --verbose --exit-code 1 --report-format json --report-path reports/secrets/gitleaks-dir.json
      - name: Run TruffleHog against git history
        if: ${{ !cancelled() && steps.report-safety.outcome == 'success' }}
        shell: bash
        run: bash tools/scan_trufflehog.sh
      - name: Upload secret scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-history-reports
          path: reports/secrets
          if-no-files-found: error

  sbom:
    name: SBOM generation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # SBOM generation only needs repository read access.
    permissions:
      contents: read # allow checkout and SBOM source discovery
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: superzip-sbom.spdx.json
          upload-artifact: true
