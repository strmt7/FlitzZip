name: windows-ci

on:
  push:
    paths: &native-inputs
      - .github/workflows/windows-ci.yml
      - CMakeLists.txt
      - LICENSE
      - cmake/**
      - src/**
      - fuzz/**
      - tests/**
      - third_party/**
      - resources/app/**
      - resources/brand/**
      - resources/licenses/**
      - tools/build.ps1
      - tools/test.ps1
      - tools/compile_hip_object.ps1
      - tools/hip_architecture.ps1
      - tools/rocm_toolchain.ps1
      - tools/rocm-sdk-lock.json
      - tools/process_environment.ps1
      - tools/cmake_toolchain.ps1
      - tools/build_parallelism.ps1
      - tools/local_resources.ps1
      - tools/version.ps1
      - tools/generate_brand_logo_header.ps1
      - tools/superzip_brand_logo.psm1
      - tools/generate_license_notices_header.ps1
      - tools/native_build_provenance.py
      - tools/native_build_receipt.py
      - tools/bootstrap_rocm_sdk.py
  pull_request:
    paths: *native-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: windows-2022
            generator: Visual Studio 17 2022
          - os: windows-2025-vs2026
            generator: Visual Studio 18 2026
    env:
      SUPERZIP_CMAKE_GENERATOR: ${{ matrix.generator }}
      # Shared build scheduling is derived from available RAM and logical CPUs.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain diagnostics
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          Get-Command cmake | Select-Object Source,Version
      - name: Build
        shell: pwsh
        run: tools/build.ps1 -CpuOnlyValidation -Generator $env:SUPERZIP_CMAKE_GENERATOR
      - name: Validate actual native invocation receipt
        # Mechanism regressions run in the component-contracts lane when changed.
        # This check binds every native build to its actual configured outputs.
        shell: pwsh
        run: |
          python tools/native_build_receipt.py validate --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Configured CPU build receipt is stale or incomplete." }
      - name: Test
        shell: pwsh
        run: tools/test.ps1
      - name: CLI format compatibility matrix
        shell: pwsh
        run: tools/format_matrix_smoke.ps1
      - name: Security scan
        shell: pwsh
        run: tools/security_scan.ps1
