name: windows-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: windows-2022
            generator: Visual Studio 17 2022
          - os: windows-2025-vs2026
            generator: Visual Studio 18 2026
    env:
      SUPERZIP_CMAKE_GENERATOR: ${{ matrix.generator }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain diagnostics
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          Get-Command cmake | Select-Object Source,Version
      - name: Configure
        shell: pwsh
        run: tools/build.ps1 -ConfigureOnly -CpuOnlyValidation -Generator $env:SUPERZIP_CMAKE_GENERATOR
      - name: Build
        shell: pwsh
        run: tools/build.ps1 -CpuOnlyValidation -Generator $env:SUPERZIP_CMAKE_GENERATOR
      - name: Test
        shell: pwsh
        run: tools/test.ps1
      - name: Security scan
        shell: pwsh
        run: tools/security_scan.ps1
