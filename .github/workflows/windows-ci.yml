name: windows-ci

on:
  push:
    paths: &native-inputs
      - .github/workflows/windows-ci.yml
      - CMakeLists.txt
      - LICENSE
      - cmake/**
      - src/**
      - fuzz/**
      - tests/**
      - third_party/**
      - resources/app/**
      - resources/design/**
      - resources/brand/**
      - resources/licenses/**
      - tools/build.ps1
      - tools/test.ps1
      - tools/gui_smoke.ps1
      - tools/SuperZip.GuiSmoke.*.psm1
      - tools/generate_app_icon.ps1
      - tools/verify_brand_assets.ps1
      - tools/compile_hip_object.ps1
      - tools/hip_architecture.ps1
      - tools/rocm_toolchain.ps1
      - tools/rocm-sdk-lock.json
      - tools/process_environment.ps1
      - tools/cmake_toolchain.ps1
      - tools/build_parallelism.ps1
      - tools/local_resources.ps1
      - tools/version.ps1
      - tools/generate_brand_logo_header.ps1
      - tools/superzip_brand_logo.psm1
      - tools/generate_license_notices_header.ps1
      - tools/native_build_provenance.py
      - tools/native_build_receipt.py
      - tools/bootstrap_rocm_sdk.py
      - '!src/gpu/*.hip.cpp'
  pull_request:
    paths: *native-inputs
  workflow_dispatch:
    inputs:
      comparison_base:
        description: Complete base commit SHA for affected native checks; empty runs broad qualification
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: windows-2022
            generator: Visual Studio 17 2022
          - os: windows-2025-vs2026
            generator: Visual Studio 18 2026
    env:
      SUPERZIP_CMAKE_GENERATOR: ${{ matrix.generator }}
      # Shared build scheduling is derived from available RAM and logical CPUs.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select affected hosted native work
        id: native_plan
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DISPATCH_BASE: ${{ inputs.comparison_base }}
        run: |
          tools/ci_native_plan.ps1 -EventName $env:EVENT_NAME -PushBase $env:PUSH_BASE `
            -PullRequestBase $env:PR_BASE -DispatchBase $env:DISPATCH_BASE -GitHubOutput $env:GITHUB_OUTPUT
      - name: Toolchain diagnostics
        if: steps.native_plan.outputs.native_build == 'true'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          Get-Command cmake | Select-Object Source,Version
      - name: Build
        if: steps.native_plan.outputs.native_build == 'true'
        shell: pwsh
        run: tools/build.ps1 -CpuOnlyValidation -Generator $env:SUPERZIP_CMAKE_GENERATOR
      - name: Validate actual native invocation receipt
        if: steps.native_plan.outputs.native_build == 'true'
        # Mechanism regressions run in the component-contracts lane when changed.
        # This check binds every native build to its actual configured outputs.
        shell: pwsh
        run: |
          python tools/native_build_receipt.py validate --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Configured CPU build receipt is stale or incomplete." }
      - name: Test
        if: steps.native_plan.outputs.native_tests == 'true'
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DISPATCH_BASE: ${{ inputs.comparison_base }}
        run: |
          tools/ci_native_plan.ps1 -EventName $env:EVENT_NAME -PushBase $env:PUSH_BASE `
            -PullRequestBase $env:PR_BASE -DispatchBase $env:DISPATCH_BASE -RunTests
      - name: CLI format compatibility matrix
        if: steps.native_plan.outputs.format_matrix == 'true'
        shell: pwsh
        run: tools/format_matrix_smoke.ps1
      - name: Affected repository policy scan
        if: steps.native_plan.outputs.policy_scan == 'true' && matrix.os == 'windows-2022'
        shell: pwsh
        run: tools/security_scan.ps1
