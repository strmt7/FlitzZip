name: windows-ci

on:
  push:
    paths: &native-inputs
      - .github/workflows/windows-ci.yml
      - CMakeLists.txt
      - LICENSE
      - cmake/**
      - src/**
      - fuzz/**
      - tests/**
      - third_party/**
      - resources/app/**
      - resources/brand/**
      - resources/licenses/**
      - tools/build.ps1
      - tools/test.ps1
      - tools/gui_smoke.ps1
      - tools/FlitzZip.GuiSmoke.*.psm1
      - tools/generate_app_icon.ps1
      - tools/verify_brand_assets.ps1
      - tools/compile_hip_object.ps1
      - tools/hip_architecture.ps1
      - tools/rocm_toolchain.ps1
      - tools/rocm-sdk-lock.json
      - tools/process_environment.ps1
      - tools/cmake_toolchain.ps1
      - tools/cmake-toolchain.sha256
      - tools/build_parallelism.ps1
      - tools/local_resources.ps1
      - tools/version.ps1
      - tools/generate_brand_logo_header.ps1
      - tools/flitzzip_brand_logo.psm1
      - tools/generate_license_notices_header.ps1
      - tools/native_build_provenance.py
      - tools/native_build_receipt.py
      - tools/bootstrap_rocm_sdk.py
      - tools/native_coverage.py
      - tools/native_coverage_report.py
      - tools/native-coverage-toolchain.json
      - '!src/gpu/*.hip.cpp'
  pull_request:
    paths: *native-inputs
  workflow_dispatch:
    inputs:
      comparison_base:
        description: Complete base commit SHA for affected native checks; empty runs broad qualification
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Codecov authenticates this repository's measured report using GitHub OIDC.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: windows-2022
            generator: Visual Studio 17 2022
            disable_pch: true
            configuration: Debug
            coverage: true
          - os: windows-2025-vs2026
            generator: Visual Studio 18 2026
            disable_pch: false
            configuration: Release
            coverage: false
    env:
      FLITZZIP_CMAKE_GENERATOR: ${{ matrix.generator }}
      FLITZZIP_DISABLE_PCH: ${{ matrix.disable_pch }}
      FLITZZIP_CONFIGURATION: ${{ matrix.configuration }}
      # Shared build scheduling is derived from available RAM and logical CPUs.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select affected hosted native work
        id: native_plan
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DISPATCH_BASE: ${{ inputs.comparison_base }}
        run: |
          tools/ci_native_plan.ps1 -EventName $env:EVENT_NAME -PushBase $env:PUSH_BASE `
            -PullRequestBase $env:PR_BASE -DispatchBase $env:DISPATCH_BASE `
            -Configuration $env:FLITZZIP_CONFIGURATION -GitHubOutput $env:GITHUB_OUTPUT
      - name: Toolchain diagnostics
        if: steps.native_plan.outputs.native_build == 'true'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          Get-Command cmake | Select-Object Source,Version
      - name: Build
        if: steps.native_plan.outputs.native_build == 'true'
        shell: pwsh
        # One existing compiler lane proves complete source/header independence;
        # the other uses the same PCH strategy as ordinary local/product builds.
        run: >-
          tools/build.ps1 -CpuOnlyValidation -Generator $env:FLITZZIP_CMAKE_GENERATOR
          -Configuration $env:FLITZZIP_CONFIGURATION
          -DisablePrecompiledHeaders:($env:FLITZZIP_DISABLE_PCH -eq 'true')
      - name: Validate actual native invocation receipt
        if: steps.native_plan.outputs.native_build == 'true'
        # Mechanism regressions run in the component-contracts lane when changed.
        # This check binds every native build to its actual configured outputs.
        shell: pwsh
        run: |
          python tools/native_build_receipt.py validate --configuration $env:FLITZZIP_CONFIGURATION
          if ($LASTEXITCODE -ne 0) { throw "Configured CPU build receipt is stale or incomplete." }
      - name: Test
        if: steps.native_plan.outputs.native_tests == 'true'
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DISPATCH_BASE: ${{ inputs.comparison_base }}
        run: |
          tools/ci_native_plan.ps1 -EventName $env:EVENT_NAME -PushBase $env:PUSH_BASE `
            -PullRequestBase $env:PR_BASE -DispatchBase $env:DISPATCH_BASE `
            -Configuration $env:FLITZZIP_CONFIGURATION -RunTests
      - name: CLI format compatibility matrix
        if: >-
          steps.native_plan.outputs.format_matrix == 'true' &&
          !(matrix.coverage && steps.native_plan.outputs.native_coverage == 'true')
        shell: pwsh
        run: tools/format_matrix_smoke.ps1 -Configuration $env:FLITZZIP_CONFIGURATION
      - name: Measure native CPU coverage
        if: matrix.coverage && steps.native_plan.outputs.native_coverage == 'true'
        shell: pwsh
        run: python -B -m tools.native_coverage
      - name: Upload measured coverage to Codecov
        if: >-
          matrix.coverage && steps.native_plan.outputs.native_coverage == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          cleanup: true
          files: out/coverage/native.xml
          flags: native_cpu
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
          version: v11.3.1
      - name: Retain coverage evidence
        if: always() && matrix.coverage && steps.native_plan.outputs.native_coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cpu-coverage
          path: |
            out/coverage/*.xml
            out/coverage/*.json
            out/coverage/*.log
          if-no-files-found: error
          retention-days: 7
      - name: Affected repository policy scan
        if: steps.native_plan.outputs.policy_scan == 'true' && matrix.os == 'windows-2022'
        shell: pwsh
        run: tools/security_scan.ps1
