version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:10"
      timezone: UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: deps(actions)
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
      day: monday
      time: "04:20"
      timezone: UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      python-tooling:
        patterns:
          - "*"
    commit-message:
      prefix: deps(python)
  - package-ecosystem: pip
    directory: /tools/requirements
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      research-tooling:
        patterns:
          - "*"
    commit-message:
      prefix: deps(research)
