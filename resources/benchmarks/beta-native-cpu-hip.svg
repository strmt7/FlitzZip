<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 274" width="1200" height="274" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">SuperZip RAM-only benchmark</title><desc id="desc">Paired forced-CPU and required-HIP RAM-only synthetic SUZIP results. Left: exact encoded payload bytes, excluding archive metadata. Right: throughput from median elapsed time; whiskers retain every confirmation sample's min-max range, not confidence intervals.</desc><rect width="1200" height="274" fill="#ffffff" /><text x="32" y="42" font-size="25" font-weight="bold" fill="#17252b" text-anchor="start" letter-spacing="0">SuperZip | measured native-format performance</text><text x="32" y="70" font-size="14" font-weight="normal" fill="#53656d" text-anchor="start" letter-spacing="0">RAM-only synthetic workloads. Paired runs; no archive disk writes.</text><text x="318" y="116" font-size="16" font-weight="bold" fill="#263238" text-anchor="start" letter-spacing="0">Encoded size</text><text x="318" y="136" font-size="12" font-weight="normal" fill="#53656d" text-anchor="start" letter-spacing="0">Lower is better</text><text x="786" y="116" font-size="16" font-weight="bold" fill="#263238" text-anchor="start" letter-spacing="0">End-to-end throughput</text><text x="786" y="136" font-size="12" font-weight="normal" fill="#53656d" text-anchor="start" letter-spacing="0">Median elapsed time; whiskers: all-sample min-max</text><line x1="32" x2="1168" y1="151" y2="151" stroke="#dce5e7" /><text x="32" y="168" font-size="14" font-weight="bold" fill="#263238" text-anchor="start" letter-spacing="0">Mixed | 10 GiB | level 5 | 8192 KiB blocks</text><text x="50" y="197" font-size="13" font-weight="normal" fill="#263238" text-anchor="start" letter-spacing="0">Forced CPU</text><rect x="318" y="183" width="259" height="17" rx="2" fill="#394b53"><title>4,516,066,387 encoded bytes</title></rect><text x="593" y="197" font-size="13" font-weight="normal" fill="#263238" text-anchor="start" letter-spacing="0">4,306.9 MiB</text><rect x="786" y="183" width="127" height="17" rx="2" fill="#394b53"><title>0.981 GiB/s, encode + verify + decode</title></rect><text x="1061" y="197" font-size="13" font-weight="normal" fill="#263238" text-anchor="start" letter-spacing="0">0.98 GiB/s</text><g class="sample-range" stroke="#17252b"><title>All 6 confirmation samples: 0.965776 to 0.991471 GiB/s; elapsed-time sample SD 0.086281 s. Observed min-max range; not a confidence interval.</title><line x1="910.780" x2="914.100" y1="191.5" y2="191.5" /><line x1="910.780" x2="910.780" y1="187.5" y2="195.5" /><line x1="914.100" x2="914.100" y1="187.5" y2="195.5" /></g><text x="50" y="225" font-size="13" font-weight="normal" fill="#263238" text-anchor="start" letter-spacing="0">Required HIP</text><rect x="318" y="211" width="260" height="17" rx="2" fill="#087f8c"><title>4,527,834,600 encoded bytes</title></rect><text x="593" y="225" font-size="13" font-weight="normal" fill="#263238" text-anchor="start" letter-spacing="0">4,318.1 MiB</text><rect x="786" y="211" width="256" height="17" rx="2" fill="#087f8c"><title>1.978 GiB/s, encode + verify + decode</title></rect><text x="1061" y="225" font-size="13" font-weight="normal" fill="#263238" text-anchor="start" letter-spacing="0">1.98 GiB/s</text><g class="sample-range" stroke="#17252b"><title>All 6 confirmation samples: 1.910103 to 2.012359 GiB/s; elapsed-time sample SD 0.106956 s. Observed min-max range; not a confidence interval.</title><line x1="1032.788" x2="1046.000" y1="219.5" y2="219.5" /><line x1="1032.788" x2="1032.788" y1="215.5" y2="223.5" /><line x1="1046.000" x2="1046.000" y1="215.5" y2="223.5" /></g><text x="32" y="254" font-size="12" font-weight="normal" fill="#53656d" text-anchor="start" letter-spacing="0">Median elapsed time of at least 6 paired runs | commit e950e0603595 | binary SHA-256 a2294790af46...</text></svg>
